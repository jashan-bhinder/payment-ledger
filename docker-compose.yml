services:
  postgres:
    image: postgres:17
    container_name: payment-ledger-postgres
    environment:
      POSTGRES_DB: payment_ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger_postgres_data:/var/lib/postgresql/data
volumes:
  ledger_postgres_data: